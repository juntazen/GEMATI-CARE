[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemati-care"
version = "1.1.0"
description = "Reproducible CPU pipeline for cost-sensitive temporal conformal routing"
requires-python = ">=3.11"
dependencies = [
  "datasets>=3.0",
  "joblib>=1.3",
  "matplotlib>=3.8",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=16",
  "scikit-learn>=1.6",
  "scipy>=1.12",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
encoder = ["transformers>=4.45", "torch>=2.3"]
test = ["pytest>=8.0"]

[project.scripts]
gemati = "gemati.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

